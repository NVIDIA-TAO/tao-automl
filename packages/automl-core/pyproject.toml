[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-automl-core"
version = "0.1.0"
description = "Repository-neutral, bounded hyperparameter search"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["numpy", "scipy", "scikit-learn", "pydantic>=2", "PyYAML", "tomli-w", "tomli; python_version < '3.11'"]

[project.scripts]
automl = "automl_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
automl_core = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
